name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-12
            c_compiler: gcc-12
            cpp_compiler: g++-12
          - os: windows-latest
            compiler: msvc
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Configure CMake (Linux GCC)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y g++-12
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Simulator & Tests
        run: |
          cmake --build build --config Release

      - name: Run Catch2 Tests
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Verify CLI Simulation Run
        run: |
          ${{ runner.os == 'Windows' && 'build/Release/heterosched_cli.exe' || './build/heterosched_cli' }} --workload workloads/compute_heavy.json --policy heft --output results/test_out.json --trace results/test_trace.json
